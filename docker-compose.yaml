services:
  askvk-postgres:
    image: postgres:latest
    container_name: askvk-postgres
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_user -d postgres_db" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  askvk_django:
    container_name: askvk_django
    volumes:
      - django_logs:/logs
      - ./static:/app/static
      - ./media:/app/media
    build:
      context: .
    expose:
      - 8000
    env_file:
      - .env
    environment:
      POSTGRES_HOST: askvk-postgres
      POSTGRES_PORT: 5432
    depends_on:
      - askvk-postgres

    restart: unless-stopped

  nginx:
    container_name: nginx
    build: ./nginx
    volumes:
      - ./static:/static
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
    depends_on:
      - askvk_django
    restart: unless-stopped

volumes:
  postgres_data:
  django_logs:
  nginx_logs:
