services:
  askvk-postgres:
    image: postgres:latest
    container_name: askvk-postgres
    env_file:
      - .env.docker
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  askvk_django:
    container_name: askvk_django
    volumes:
      - django_logs:/logs
      - ./:/app
      - static_data:/app/static_temp
      - ./media:/app/media
    build:
      context: .
    expose:
      - 8000
    env_file:
      - .env.docker
    depends_on:
      askvk-postgres:
        condition: service_healthy
    develop:
      watch:
        - action: restart
          path: ./AskVK
        - action: restart
          path: ./core
          ignore:
            - "**/__pycache__/"
            - migrations/
        - action: restart
          path: ./questions
          ignore:
            - "**/__pycache__/"
            - migrations/
        - action: restart
          path: ./templates
        - action: restart
          path: ./scripts/entry.sh
        - action: restart
          path: ./static
    restart: unless-stopped

  nginx:
    container_name: nginx
    build: ./nginx
    volumes:
      - static_data:/static:ro
      - ./media:/media:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
    depends_on:
      - askvk_django
    restart: unless-stopped

volumes:
  postgres_data:
  django_logs:
  nginx_logs:
  static_data: