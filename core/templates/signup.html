{% extends "base.html" %}
{% block title %}{{ page_title }} - AskVK{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{{ page_title }}</h1>
<div class="card form-card">
  <div class="card-body p-3 p-lg-4">
    <form method="post" action="{% url 'signup' %}" enctype="multipart/form-data">
      {% csrf_token %}
      {% include "includes/account_form.html" %}
      <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
      <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
    </form>
  </div>
</div>
{% endblock %}
