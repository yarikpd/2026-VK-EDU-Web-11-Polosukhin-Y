{% extends "base.html" %}
{% block title %}{{ page_title }} - AskVK{% endblock %}
{% block content %}
<h1 class="h3 mb-4">{{ page_title }}</h1>
<div class="card form-card">
  <div class="card-body p-3 p-lg-4">
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next_url }}">
      {% include "includes/account_form.html" %}
      <p>Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a></p>
      <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
    </form>
  </div>
</div>
{% endblock %}
