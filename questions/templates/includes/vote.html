<form action="{% url action post.pk %}" method="post" data-vote-form>
  {% if user.is_authenticated %}{% csrf_token %}{% endif %}
  <fieldset class="m-0"{% if not user.is_authenticated %} disabled title="Войдите, чтобы голосовать"{% endif %}>
    <legend class="visually-hidden">Оценка публикации</legend>
    <div class="btn-group btn-group-sm">
      <button class="btn btn-outline-primary{% if post.user_vote == 1 %} active{% endif %}" type="submit" name="value" value="1" aria-pressed="{% if post.user_vote == 1 %}true{% else %}false{% endif %}">
        <span aria-hidden="true">+</span><span class="visually-hidden">Нравится</span>
      </button>
      <button class="btn btn-outline-secondary" type="submit" name="value" value="0" title="Сбросить голос">
        <span data-rating aria-live="polite">{{ post.rating }}</span><span class="visually-hidden"> — рейтинг, сбросить голос</span>
      </button>
      <button class="btn btn-outline-primary{% if post.user_vote == -1 %} active{% endif %}" type="submit" name="value" value="-1" aria-pressed="{% if post.user_vote == -1 %}true{% else %}false{% endif %}">
        <span aria-hidden="true">−</span><span class="visually-hidden">Не нравится</span>
      </button>
    </div>
  </fieldset>
  <div class="text-danger small mt-1" data-action-error role="alert" hidden></div>
</form>
