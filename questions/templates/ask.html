{% extends "base.html" %}
{% block title %}Новый вопрос — AskVK{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Новый вопрос</h1>
<div class="card form-card">
  <div class="card-body p-3 p-lg-4">
    <form method="post">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button class="btn btn-primary" type="submit">Опубликовать вопрос</button>
    </form>
  </div>
</div>
{% endblock %}
